<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Panel · surveyBQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow:wght@500;600;700;800&display=swap">
<link rel="icon" type="image/png" href="assets/marca/bequarks-favicon.png">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<header class="sbq-topbar">
  <div class="sbq-topbar-inner" style="max-width:1380px">
    <a class="sbq-brand" href="index.html" style="text-decoration:none;color:inherit">
      <img class="sbq-logo-full sbq-en-claro" src="assets/marca/bequarks-full.png" alt="Be Quarks">
      <img class="sbq-logo-full sbq-en-oscuro" src="assets/marca/bequarks-full-dark.png" alt="" aria-hidden="true">
      <span class="sbq-brand-div"></span>
      surveyBQ <small>panel</small>
    </a>
    <select class="sbq-select" id="sbq-picker" style="width:auto;min-width:210px"></select>
    <span class="sbq-spacer"></span>
    <span id="sbq-fuente" class="sbq-row"></span>
    <button class="sbq-btn sbq-btn-sm" id="btn-cargar">Cargar datos</button>
    <button class="sbq-btn sbq-btn-sm" id="btn-muestra">Datos de ejemplo</button>
    <button class="sbq-btn sbq-btn-sm" id="btn-exportar">Exportar</button>
    <button class="sbq-btn sbq-btn-sm" id="btn-imprimir">Imprimir</button>
  </div>
</header>

<main class="sbq-panel-app">
  <div id="sbq-filtros" class="sbq-filtros"></div>
  <div id="sbq-kpis" class="sbq-kpis"></div>
  <div id="sbq-graficos" class="sbq-graficos"></div>
</main>

<div class="sbq-toast" id="sbq-toast"></div>
<div id="tip" class="sbq-tip"></div>

<script src="src/core/registry.js"></script>
<script src="config.js"></script>
<script src="src/core/expression.js"></script>
<script src="src/core/model.js"></script>
<script src="src/core/runtime.js"></script>
<script src="src/io/storage.js"></script>
<script src="src/io/bigquery.js"></script>
<script src="src/io/analisis.js"></script>
<script src="src/ui/theme.js"></script>
<script src="src/ui/render.js"></script>
<script src="surveys/nps-relacional.js"></script>
<script src="surveys/demo-tipos.js"></script>
<script src="src/ui/panel.js"></script>
</body>
</html>
